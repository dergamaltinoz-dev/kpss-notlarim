<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>KPSS Notlarım - Konu Anlatım Platformu</title>
    
    <!-- PWA & Mobile Meta Tags -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#8b5cf6" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="KPSS Notlarım" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    
    <script>
      // Clear legacy service worker registrations on mount if requested or cached
      if (window.location.search.indexOf('reset=1') !== -1) {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(regs) {
            regs.forEach(function(r) { r.unregister(); });
          });
        }
        if ('caches' in window) {
          caches.keys().then(function(keys) {
            keys.forEach(function(k) { caches.delete(k); });
          });
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    
    <!-- Auto-recovery script if React fails to mount due to stale browser SW cache -->
    <script>
      window.addEventListener('load', function() {
        setTimeout(function() {
          var rootEl = document.getElementById('root');
          if (rootEl && rootEl.childElementCount === 0) {
            console.warn('Empty root detected after load. Purging SW caches...');
            if ('serviceWorker' in navigator) {
              navigator.serviceWorker.getRegistrations().then(function(regs) {
                regs.forEach(function(reg) { reg.unregister(); });
              });
            }
            if ('caches' in window) {
              caches.keys().then(function(names) {
                names.forEach(function(name) { caches.delete(name); });
              });
            }
            setTimeout(function() {
              window.location.reload(true);
            }, 600);
          }
        }, 3000);
      });
    </script>
  </body>
</html>
